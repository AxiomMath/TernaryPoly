name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: AxiomMath/TernaryPoly
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ternarypoly1
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"Comparator/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
